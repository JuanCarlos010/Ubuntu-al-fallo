<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodi'n Line - Mi Perfil</title>
    <link rel="icon" href="../img/MotoAzulLogo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../CSS/style.css" />
</head>

<body>
    <header class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <img src="../img/Logo_Header_Letras_Blancas.png" alt="Logo Foodi'n Line" class="logo" />
            
            <div class="user-actions">
                <div class="action-item">
                    <i class="bi bi-bell-fill"></i>
                    <div class="dropdown-menu">
                        <p>Notificaciones</p>
                    </div>
                </div>

                <div class="action-item">
                    <i class="bi bi-person-circle"></i>
                    <div class="dropdown-menu">
                        <a href="perfil.html">Mi Perfil</a>
                        <a href="index.html">Volver a restaurantes</a>
                        <a href="login.html">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mt-5">
        <div class="bg-white p-4 p-md-5 rounded-4 shadow-lg">
            <div class="row">
                
                <!-- Sección Foto -->
                <div class="col-md-4 text-center border-end border-2" style="border-color: var(--bg-cream) !important;">
                    <div class="py-4">
                        <div class="mx-auto d-flex align-items-center justify-content-center shadow" 
                             style="width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-orange), var(--secondary-yellow));">
                            <i class="bi bi-person-fill text-white" style="font-size: 100px;"></i>
                        </div>
                        <h3 class="mt-4 fw-bold text-dark" id="profile-fullname">Cargando...</h3>
                        <p class="text-muted" id="profile-email-small">correo@ejemplo.com</p>
                    </div>
                </div>

                <!-- Sección Información -->
                <div class="col-md-8">
                    <div class="ps-md-5 pt-4 pt-md-0">
                        <h2 class="fw-bold mb-4" style="color: var(--primary-orange); border-bottom: 3px solid var(--secondary-yellow); display: inline-block; padding-bottom: 5px;">
                            Información Personal
                        </h2>
                        
                        <div class="p-4 rounded-3" style="background-color: var(--bg-cream);">
                            
                            <div class="mb-3 pb-3 border-bottom">
                                <label class="fw-bold text-muted small"><i class="bi bi-person-fill me-2"></i>Nombre</label>
                                <p class="fs-5 m-0 text-dark fw-semibold" id="profile-name">Cargando...</p>
                            </div>

                            <div class="mb-3 pb-3 border-bottom">
                                <label class="fw-bold text-muted small"><i class="bi bi-person-fill me-2"></i>Apellido</label>
                                <p class="fs-5 m-0 text-dark fw-semibold" id="profile-lastname">Cargando...</p>
                            </div>

                            <div class="mb-3 pb-3 border-bottom">
                                <label class="fw-bold text-muted small"><i class="bi bi-envelope-fill me-2"></i>Correo Electrónico</label>
                                <p class="fs-5 m-0 text-dark fw-semibold" id="profile-email">correo@ejemplo.com</p>
                            </div>

                            <div>
                                <label class="fw-bold text-muted small"><i class="bi bi-calendar-fill me-2"></i>Miembro desde</label>
                                <p class="fs-5 m-0 text-dark fw-semibold" id="profile-date">Enero 2025</p>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Script de tu compañero de backend -->
    <script src="../BackEnd/datosPerfil/PerfilFunctions.js"></script>
</body>
</html>
