<!DOCTYPE html> 
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodi'n Line - Iniciar Sesión</title>
    <link rel="icon" href="../img/MotoAzulLogo.png" type="image/png">

    <!-- CSS principal del proyecto -->
    <link rel="stylesheet" href="../CSS/style.css">
    <!-- CSS específico de autenticación (mismo que registro) -->
    <link rel="stylesheet" href="../CSS/registro.css">

    <!-- Fuentes e iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="text-center mb-4">
                <img src="../img/MotoAzulLogo.png" alt="Foodi'n Line" class="auth-logo">
                <h3 class="fw-bold text-dark">Bienvenido de nuevo</h3>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" class="form-control" id="User-email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-group mt-3 mb-2">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="User-password" placeholder="Contraseña" required>
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="recuperar.html" class="text-decoration-none small fw-bold">¿Olvidaste tu contraseña?</a>
            </div>

            <button id="btnLogin" class="btn btn-primary-custom w-100 mb-3" onclick="simularLogin()">
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </button>

            <p class="text-center text-muted m-0">
                ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold">Regístrate</a>
            </p>
        </div>
    </div>

    <script>
        function simularLogin() {
            let email = document.getElementById('User-email').value;
            let pass = document.getElementById('User-password').value;

            if(!email || !pass) {
                Swal.fire('Campos vacíos', 'Por favor, ingresa tu correo y contraseña.', 'warning');
                return;
            }

            Swal.fire({
                title: '¡Bienvenido!',
                text: 'Inicio de sesión exitoso.',
                icon: 'success',
                confirmButtonColor: '#4CAF50',
                confirmButtonText: 'Continuar'
            }).then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
