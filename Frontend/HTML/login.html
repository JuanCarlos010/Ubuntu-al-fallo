<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodi'n Line - Ingresar</title>
    <link rel="icon" href="../img/MotoAzulLogo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <img src="../img/MotoAzulLogo.png" alt="Foodi'n Line">
            <h2 class="mb-2 text-dark fw-bold">Bienvenido</h2>
            <p class="text-muted mb-4">Inicia sesión para continuar</p>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="emailInput" class="form-control" placeholder="Correo electrónico">
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="passwordInput" class="form-control" placeholder="Contraseña">
            </div>

            <!-- Botón que simula el inicio de sesión -->
            <button class="btn btn-primary-custom w-100 mb-3" onclick="simularLogin()">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>

            <p class="text-muted">
                ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold" style="color: var(--primary-orange);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        function simularLogin() {
            let email = document.getElementById('emailInput').value;
            let pass = document.getElementById('passwordInput').value;

            if(!email || !pass) {
                Swal.fire('Error', 'Por favor, llena todos los campos.', 'error');
                return;
            }

            // Simulamos que el login es exitoso
            Swal.fire({
                title: '¡Bienvenido!',
                text: 'Inicio de sesión exitoso. Redirigiendo a tu pedido...',
                icon: 'success',
                timer: 2000,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'detallesPedido.html';
            });
        }
    </script>
</body>
</html>
