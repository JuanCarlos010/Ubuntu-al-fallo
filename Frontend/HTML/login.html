<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodi'n Line - Ingresar</title>
    <link rel="icon" href="../img/MotoAzulLogo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="text-center mb-4">
                <img src="../img/MotoAzulLogo.png" alt="Foodi'n Line" style="width: 80px; margin-bottom: 15px;">
                <h2 class="fw-bold text-dark">Bienvenido de nuevo</h2>
                <p class="text-muted">Ingresa tus credenciales para continuar</p>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" id="emailInput" class="form-control" placeholder="Correo electrónico">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="passwordInput" class="form-control" placeholder="Contraseña">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Recordarme</label>
                </div>
                <a href="#" class="text-decoration-none small fw-bold" style="color: var(--primary-orange);">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn btn-primary-custom w-100 mb-4" onclick="simularLogin()">
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </button>

            <p class="text-center text-muted m-0">
                ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold" style="color: var(--primary-orange);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        function simularLogin() {
            let email = document.getElementById('emailInput').value;
            let pass = document.getElementById('passwordInput').value;

            if(!email || !pass) {
                Swal.fire('Campos vacíos', 'Por favor, llena todos los campos.', 'warning');
                return;
            }

            Swal.fire({
                title: '¡Bienvenido!',
                text: 'Inicio de sesión exitoso. Redirigiendo...',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'detallesPedido.html';
            });
        }
    </script>
</body>
</html>
