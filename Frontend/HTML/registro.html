<!DOCTYPE html> 
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodi'n Line - Registrar</title>
    <link rel="icon" href="../img/MotoAzulLogo.png" type="image/png">
    <!-- Enlazamos al nuevo CSS global -->
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="register-header mb-4">
                <img class="site-logo" src="../img/MotoAzulLogo.png" alt="Foodi'n Line" style="width: 120px; margin-bottom: 15px;">
                <h3 class="fw-bold text-dark">Crea tu cuenta</h3>
                <p class="text-muted">Ordena, disfruta y comparte el sabor</p>
            </div>

            <!-- Campos -->
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="User-name" placeholder="Nombre" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="User-lastname" placeholder="Apellido" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="User-email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="User-password" placeholder="Contraseña" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="Password-confirmation" placeholder="Confirmar contraseña" required>
            </div>

            <div id="passwordHelpBlock" class="form-text mb-3 text-start">
                Tu contraseña debe tener 8-20 caracteres, contener letras y números.
            </div>

            <div class="form-check mb-4 text-start">
                <input class="form-check-input" type="checkbox" id="checkboxInitial" required>
                <label class="form-check-label" for="checkboxInitial">
                    <a href="terminos.html" class="text-decoration-none fw-bold" style="color: var(--primary-orange);">Acepto los términos y condiciones</a>
                </label>
            </div>

            <button id="btnRegistrar" class="btn btn-primary-custom w-100 mb-3" onclick="simularRegistro()">
                <i class="bi bi-box-arrow-in-right"></i> Registrar
            </button>

            <p class="text-muted">
                ¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--primary-orange);">Inicia Sesión</a>
            </p>
        </div>
    </div>

    <script>
        function simularRegistro() {
            // Validación básica visual
            let nombre = document.getElementById('User-name').value;
            let pass = document.getElementById('User-password').value;
            let confirmPass = document.getElementById('Password-confirmation').value;
            let check = document.getElementById('checkboxInitial').checked;

            if(!nombre || !pass || !confirmPass) {
                Swal.fire('Campos vacíos', 'Por favor, llena todos los campos requeridos.', 'warning');
                return;
            }
            if(pass !== confirmPass) {
                Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
                return;
            }
            if(!check) {
                Swal.fire('Términos', 'Debes aceptar los términos y condiciones.', 'info');
                return;
            }

            // Simulación de registro exitoso
            Swal.fire({
                title: '¡Registro Exitoso!',
                text: 'Tu cuenta ha sido creada. Ahora puedes iniciar sesión.',
                icon: 'success',
                confirmButtonColor: '#4CAF50',
                confirmButtonText: 'Ir al Login'
            }).then(() => {
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
